name: CMake

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            packages: TGZ
          - name: Windows
            os: windows-latest
            packages: ZIP;WIX
          - name: macOS
            os: macos-latest
            packages: DragNDrop;ZIP
            cmake-params: "-DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # the tags give the version

      # CMakeLists.txt needs CMake 4.1, the runner images may have an older one
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.1.x'

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev

      # The MSI installer is made with WiX 3 (CPack's WIX generator). The runner images have it, it is only installed
      # when it is missing.
      - name: Find WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Find-Candle {
            $onPath = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($onPath) { return $onPath.Source }
            if ($env:WIX -and (Test-Path (Join-Path $env:WIX "bin\candle.exe"))) { return Join-Path $env:WIX "bin\candle.exe" }
            $installed = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($installed) { return $installed.FullName }
            return $null
          }

          $candle = Find-Candle
          if ($candle) {
            Write-Host "WiX is installed: $candle"
          } else {
            Write-Host "WiX is not installed, installing it"
            choco install wixtoolset --version 3.14.1 --no-progress -y
            $candle = Find-Candle
            if (-not $candle) { throw "WiX was not installed" }
          }
          Split-Path $candle -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # CMake takes the version from the latest v<version> tag
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ${{ matrix.cmake-params }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -C ${{ env.BUILD_TYPE }} -G "${{ matrix.packages }}"

      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ModelTool-${{ matrix.name }}
          path: |
            build/ModelTool-*.zip
            build/ModelTool-*.dmg
            build/ModelTool-*.tar.gz
            build/ModelTool-*.msi
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: ModelTool ${{ github.ref_name }}
          generate_release_notes: true
          files: packages/*
          fail_on_unmatched_files: true

      - name: Cleanup
        uses: geekyeggo/delete-artifact@v6
        if: always()
        with:
          failOnError: false
          name: |
            packages/ModelTool-*
